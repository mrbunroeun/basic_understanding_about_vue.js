<!doctype html>
<html lang="en">
  <head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="text" id="app">
      <h1>{{ changeToUppercase() }}</h1>
      <p>{{ employee.name}} is {{ employee.age}} year old</p>
      <p>{{ employee.salary}}</p>

      <p>{{luckyRandomNumber()}}</p>
      <p>{{getMessage()}}</p>
      <p>{{testingTheRef}}</p>
      <p>{{luckyNumber}}</p>
    </div>
  </body>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const message = "Hello World";
        let luckyNumber = ref(10);
        const testingTheRef = ref(90);

        const employee = ref({
          name: "John",
          age: 30,
          salary: 50000,
        });

        function luckyRandomNumber() {
          return Math.floor(Math.random() * 10) + 1;
        }
        function changeToUppercase() {
          return message.toUpperCase();
        }

        // function updateLuckyNumber() {
        //   setTimeout(() => {
        //     luckyNumber.value = 77;
        //     return Math.floor(Math.random() * 10) + 1;
        //   }, 2000);
        // }

        function updateLuckyNumber() {
          setTimeout(() => {
            luckyNumber.value = 97;
            employee.value.salary = 60000;
          }, 2000);
        }
        updateLuckyNumber();

        function getMessage() {
          return message.toUpperCase();
        }

        return {
          luckyNumber,
          employee,
          testingTheRef,
          getMessage,
          changeToUppercase,
          luckyRandomNumber,
          updateLuckyNumber,
        };
      },
    }).mount("#app");
  </script>

  <style>
    .text {
      font-size: 50px;
      font-weight: bold;
      font-family: sans-serif;
    }
  </style>
</html>
