<!doctype html>
<html lang="en">
  <head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="text" id="app">
      <h1>{{ changeToUppercase() }}</h1>
      <p>{{ employee.name}} is {{ employee.age}} year old</p>

      <p>{{luckyRandomNumber()}}</p>
    </div>
  </body>

  <script>
    const { createApp } = Vue;

    createApp({
      setup() {
        const message = "Hello World";
        let luckyNumber = 7;
        const employee = {
          name: "John",
          age: 30,
          salary: 50000,
        };
        function changeToUppercase() {
          return message.toUpperCase();
        }

        function getRandomLuckyNumber() {
          return Math.floor(Math.random() * 10) + 1;
        }
        function luckyRandomNumber() {
          luckyNumber = Math.floor(Math.random() * 10) + 1;
          return "lucky number: " + luckyNumber;
        }

        return {
          luckyNumber,
          employee,
          getRandomLuckyNumber,
          changeToUppercase,
          luckyRandomNumber,
        };
      },
    }).mount("#app");
  </script>

  <style>
    .text {
      font-size: 50px;
      font-weight: bold;
      font-family: sans-serif;
    }
  </style>
</html>
